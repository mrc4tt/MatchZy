site_name: MatchZy
site_url: https://matchzy.miksen.me/
site_description: MatchZy fork for CS2 servers - match management, practice mode, coaching, live events and stats on CounterStrikeSharp.
site_author: Miksen
repo_url: https://github.com/mrc4tt/MatchZy
repo_name: mrc4tt/MatchZy
edit_uri: ""
copyright: Based on MatchZy by Shobhit Pathak. Maintained by Miksen.

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/sword-cross
    repo: fontawesome/brands/git-alt
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mz-tools.js

# Version and the landing page numbers, read from the plugin source at build time.
hooks:
  - hooks/values.py
  # Real last-change dates, Danish pages only where translated, robots.txt.
  - hooks/sitemap.py

plugins:
  - search
  # Danish next to English: a page "x.da.md" is the Danish version of "x.md". Pages without one
  # are shown in English on the Danish site. The language switch in the header (extra.alternate)
  # links to each language's start page: the plugin's per-page switch does not work with
  # navigation.instant and fails the strict build.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: da
          name: Dansk
          build: true
          theme:
            language: da
          site_description: MatchZy-fork til CS2-servere - kampstyring, practice mode, coaching, live events og statistik på CounterStrikeSharp.
          nav_translations:
            Home: Forside
            Getting started: Kom i gang
            Installation: Installation
            Updating: Opdatering
            Troubleshooting: Fejlfinding
            Guides: Guides
            Game modes: Spiltyper
            Running a match: Kør en kamp
            Ready system: Ready-systemet
            Pauses and backups: Pauser og backups
            Admin menus: Admin-menuer
            Demos (GOTV): Demoer (GOTV)
            Stats and database: Statistik og database
            Admin tickets: Admin-tickets
            Reference: Reference
            Commands: Kommandoer
            Configuration (convars): Konfiguration (convars)
            Files and folders: Filer og mapper
            Event explorer: Event-explorer
            Settings generator: Indstillings-generator
            Match config builder: Match config-builder

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true

extra:
  generator: false
  # Nav marker for pages with "new_in: <version>" in their front matter (see hooks/values.py).
  status:
    new: Recently added
  alternate:
    - name: English
      link: /
      lang: en
    - name: Dansk
      link: /da/
      lang: da
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mrc4tt/MatchZy
      name: Source, releases and issues on GitHub
    - icon: fontawesome/solid/code-fork
      link: https://github.com/shobhit-pathak/MatchZy
      name: MatchZy by Shobhit Pathak

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Updating: getting-started/updating.md
      - Gamedata: getting-started/gamedata.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Guides:
      - guides/index.md
      - Game modes: guides/game-modes.md
      - Running a match: guides/match-setup.md
      - Ready system: guides/ready-system.md
      - Pauses and backups: guides/pauses-backups.md
      - Coaching: guides/coaching.md
      - Practice mode: guides/practice.md
      - Admin menus: guides/menus.md
      - Demos (GOTV): guides/demos.md
      - Stats and database: guides/stats.md
      - Live events API: guides/events.md
      - Admin tickets: guides/admin-tickets.md
  - Reference:
      - reference/index.md
      - Commands: reference/commands.md
      - Configuration (convars): reference/convars.md
      - Settings generator: reference/config-generator.md
      - Match config JSON: reference/match-config.md
      - Match config builder: reference/match-builder.md
      - Match config examples: reference/match-examples.md
      - Events: reference/events.md
      - Event explorer: reference/event-explorer.md
      - Files and folders: reference/files.md
  - Changelog:
      - "What's new": whats-new.md
      - Full changelog: changelog.md
