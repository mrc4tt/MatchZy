// MatchZy plugin settings.
// MatchZy writes this file on first load and never overwrites it. Settings added by later versions are
// appended at the bottom. The current defaults are in defaults/config.cfg next to this file.
// Per-mode game settings live in the mode cfgs (warmup.cfg, live.cfg, ...); see <mode>_override.cfg in the docs.

// ============================================================================
// General and startup
// ============================================================================

// What the server starts in: 0 = neither, 1 = match mode, 2 = practice mode.
// Default: 1
matchzy_autostart_mode 1

// Whether warmup.cfg is executed when a warmup starts.
// Default: true
matchzy_warmup_enabled true

// Whether the knife round is on by default. Admins can toggle it with .knife.
// Default: true
matchzy_knife_enabled_default true

// Whether playout (play all rounds, no early win) is on by default. Admins can toggle it with .scrim or .playout.
// Default: false
matchzy_playout_enabled_default false

// Whether the whitelist (whitelist.cfg) is on by default. Admins can toggle it with .whitelist.
// Default: false
matchzy_whitelist_enabled_default false

// Kick everyone and refuse new players while no match is loaded.
// Load a match with matchzy_loadmatch / matchzy_loadmatch_url; then only its players can join.
// Default: false
matchzy_kick_when_no_match_loaded false

// Server hostname. "" = leave the hostname alone.
// Variables: {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1}, {TEAM2}, {TEAM1_SCORE}, {TEAM2_SCORE}
// Example: matchzy_hostname_format "MatchZy | {TEAM1} vs {TEAM2}"
// Default: ""
matchzy_hostname_format ""

// Change map automatically after a series ends (to the next map in matchzymaps.cfg).
// Set false on G5API/tournament servers where the panel handles maps. G5API matches are detected and
// never change map on their own, whatever this is set to.
// Default: true
matchzy_match_end_auto_changelevel 1

// Close the server (quit) when it has had no players for this many seconds. Bots and CSTV do not count;
// the count also runs from server start, so a server nobody joins is closed too. Sends the
// server_shutdown event with reason "empty" first and waits for demo and backup uploads. 0 = off.
// Default: 0
matchzy_empty_shutdown_seconds 0

// Whether settings changed by a match config's "cvars" block are put back when the series ends.
// Default: true
matchzy_reset_cvars_on_series_end true

// ============================================================================
// Ready-up
// ============================================================================

// Pug (no match loaded): players that must be ready before the match starts. 0 = every connected player.
// Default: 10
matchzy_minimum_ready_required 10

// Per-team ready-up. 0 = off. N = a team is ready once N of its players typed .ready, and the match
// starts when CT and T are both ready (1 = one player per team).
// Works in pugs and loaded matches; in a loaded match it replaces "every player must be ready".
// Default: 0
matchzy_ready_per_team 0

// Loaded matches: how teams get ready. 0 = players type .ready.
// 1 = join mode: a team is ready once min_players_to_ready of its players are on its side; nobody types .ready.
// Default: 0
matchzy_ready_mode 0

// Join mode only: seconds between everyone having joined and the match starting.
// Default: 10
matchzy_join_start_delay 10

// Whether .forceready (ready your whole team) can be used. Loaded matches only.
// Default: true
matchzy_allow_force_ready true

// How many players a team may be short of players_per_team and still use .forceready
// (1 = at most one short, 4 in a 5v5). -1 = only the match config's min_players_to_ready.
// Default: 1
matchzy_forceready_max_missing 1

// How the ready status is shown.
// 0 = classic center text.
// 1 = HTML READY-UP panel (progress bar, per-player status), native warmup label hidden, top timer frozen.
// 2 = no center text; a chat reminder lists who is not ready (every matchzy_chat_messages_timer_delay
//     seconds), native warmup label hidden like 1.
// Default: 0
matchzy_ready_hint_style 0

// Blink the "YOU ARE NOT READY" line of the HTML panel. Only with matchzy_ready_hint_style 1.
// Default: false
matchzy_ready_hint_blink false

// Show [READY] / [UNREADY] tags on the scoreboard during the ready phase.
// Default: true
matchzy_ready_clantag_enabled true

// Show each team's "tag" from the match config as the players' clan tag while live.
// Default: false
matchzy_team_clantag_enabled false

// Whether pinging (middle mouse button) toggles your ready status in warmup.
// Set false if players ready up by accident.
// Default: true
matchzy_ready_up_by_ping true

// Message shown when the match starts. Use $$$ for a line break. "" = no message.
// Variables: {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1}, {TEAM2}, {TEAM1_SCORE}, {TEAM2_SCORE}
// Colors: see matchzy_chat_prefix below.
// Example: {Green}Welcome to the server!{Default} $$$ Agent models may lead to {Red}disqualification!{Default}
// Default: ""
matchzy_match_start_message ""

// ============================================================================
// Knife round and map veto
// ============================================================================

// Seconds a veto captain has for each ban, pick or side choice. When it runs out the step is made at
// random (a random map, or CT for a side choice). 0 = no limit.
// Default: 0
matchzy_veto_step_timeout 0

// ============================================================================
// Pauses
// ============================================================================

// Whether players can use .pause. Admin force pause is not affected.
// Default: true
matchzy_allow_pause true

// Whether players can use .unpause. Admin force unpause is not affected.
// Default: true
matchzy_allow_unpause true

// What .pause does. false = a regular pause: it ends when both teams type .unpause (or an admin unpauses).
// true = .pause calls a tactical timeout, like .tac.
// Default: false
matchzy_use_pause_command_for_tactical_pause false

// How many times each team may use .pause in each overtime period. 0 = no limit.
// Tactical timeouts (.tac) in overtime come from live.cfg (mp_team_timeout_ot_*).
// Default: 1
matchzy_overtime_pauses_per_team 1

// Whether .tech (technical pause) is available.
// Default: true
matchzy_enable_tech_pause true

// Technical pauses each team may call per map. With matchzy_tech_pause_mode 1, 0 = unlimited.
// Default: 2
matchzy_max_tech_pauses_allowed 2

// Technical pause length in seconds. -1 = no limit.
// With matchzy_tech_pause_mode 1: seconds in freeze time before either team can unpause (0 = both teams always have to).
// Default: 300
matchzy_tech_pause_duration 300

// How a technical pause ends.
// 0 = it ends on its own after matchzy_tech_pause_duration seconds.
// 1 = Get5 rules: it never ends on its own; once it has lasted matchzy_tech_pause_duration seconds in
//     freeze time either team can .unpause, and the pausing team can cancel it before it takes effect.
// Default: 0
matchzy_tech_pause_mode 0

// Pause automatically when a team has fewer than matchzy_autopause_minplayers players during a live map.
// Default: true
matchzy_autopause_enabled true

// Players a team needs before the auto-pause triggers (2 for wingman, lower for relaxed scrims).
// Default: 5
matchzy_autopause_minplayers 5

// Seconds before the match resumes on its own once both teams have enough players again.
// Default: 3
matchzy_autopause_resume_delay 3

// ============================================================================
// Forfeit (loaded matches only)
// ============================================================================

// Seconds after a map's ready phase begins before a team that is not ready forfeits the series.
// If neither team is ready, the series ends in a tie. 0 = off.
// Get5 panels set this as get5_time_to_start. Admins can add time with .addreadytime <seconds>.
// Default: 0
matchzy_forfeit_ready_timeout 0

// The same for the ready-up before the map veto. -1 = same as matchzy_forfeit_ready_timeout, 0 = no limit.
// Get5 name: get5_time_to_start_veto.
// Default: -1
matchzy_forfeit_veto_ready_timeout -1

// Seconds a team may have nobody on its side during a live map before it forfeits the series. 0 = off.
// Default: 0
matchzy_forfeit_leave_timeout 0

// ============================================================================
// Round backups and .stop
// ============================================================================

// Whether .stop (both teams agree to replay the round) is available.
// It uses the game's own round backups, which are reliable in nearly all cases.
// Default: true
matchzy_stop_command_available true

// Whether .stop becomes unavailable once a player has damaged an opponent in the current round.
// Default: false
matchzy_stop_command_no_damage false

// Pause the match after a round restore. Players unpause with .unpause (both teams), admins can force it.
// Default: true
matchzy_pause_after_restore true

// Unpause on its own after a round restore (.restore / .stop), after matchzy_restore_unpause_delay seconds.
// false = stay paused until both teams (or an admin) unpause. Needs matchzy_pause_after_restore true.
// Default: false
matchzy_restore_auto_unpause false

// Countdown in seconds before the automatic unpause after a round restore.
// Only used with matchzy_restore_auto_unpause true.
// Default: 5
matchzy_restore_unpause_delay 5

// Also roll the scoreboard back to the restored round (round history and player K/D/A/damage).
// The game itself only restores the score, the round number and the money.
// Default: true
matchzy_restore_scoreboard_stats true

// ============================================================================
// Demos
// ============================================================================

// Folder demos are saved in, relative to csgo/. Must not start with a slash and must end with one.
// "" = the csgo folder itself.
// Default: demos/
matchzy_demo_path demos/

// Demo file name. Variables: {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1}, {TEAM2}
// Default: "{TIME}_{MATCH_ID}_{MAP}_{TEAM1}_vs_{TEAM2}"
matchzy_demo_name_format "{TIME}_{MATCH_ID}_{MAP}_{TEAM1}_vs_{TEAM2}"

// Upload with HTTP PUT and the raw .dem as the body, for S3-compatible storage with presigned URLs.
// false = HTTP POST to a panel.
// Default: false
matchzy_demo_upload_s3 false

// Where demos are uploaded when the map ends. Left unset on purpose: a presigned URL and an auth header
// are credentials, and this file is world-readable. Set them from a private cfg.
// A presigned S3 URL is per object and expires, so with matchzy_demo_upload_s3 true push it per match
// over rcon. Always quote the URL. Syntax:
// matchzy_demo_upload_url "https://your-panel.example/demo"
// matchzy_demo_upload_header_key "Authorization"
// matchzy_demo_upload_header_value "your-token"

// ============================================================================
// Chat, team names and messages
// ============================================================================

// Prefix of every MatchZy chat message.
// Colors: {Default}, {Darkred}, {Green}, {LightYellow}, {LightBlue}, {Olive}, {Lime}, {Red}, {Purple},
// {Grey}, {Yellow}, {Gold}, {Silver}, {Blue}, {DarkBlue}, {BlueGrey}, {Magenta}, {LightRed}.
// End with {Default} so the message itself is not colored. Do not use quotes or ";".
// Default: {Green}[MatchZy]{Default}
matchzy_chat_prefix {Green}[MatchZy]{Default}

// Prefix of admin messages sent with .asay <message>. Colors as above.
// Default: [{Red}ADMIN{Default}]
matchzy_admin_chat_prefix [{Red}ADMIN{Default}]

// Seconds between reminder messages (not ready, paused, ...).
// A change takes effect from the next warmup or pause.
// Default: 21
matchzy_chat_messages_timer_delay 21

// Show a damage report (given and taken per opponent) after each round.
// Default: true
matchzy_enable_damage_report true

// Scrim mode: fixed scoreboard name for the team starting CT.
// "" = automatic team_<playername> names (see matchzy_auto_team_names_enabled).
// Default: ""
matchzy_ct_name ""

// Scrim mode: fixed scoreboard name for the team starting T. "" = automatic, as above.
// Default: ""
matchzy_t_name ""

// Scrim mode: whether MatchZy sets scoreboard team names (team_<playername>, or the two settings above).
// false = the game's own names stay. Names from a match config (Get5/JSON, .match) are always applied.
// Default: true
matchzy_auto_team_names_enabled 1

// Loaded matches: when a player joins, show only the ready-up hint and hide the mode hints
// (.scrim / .prac / .knife) and the admin help line.
// Default: true
matchzy_loaded_match_hide_mode_hints true

// ============================================================================
// Coaches
// ============================================================================

// Whether players can become a coach with .coach. Coaches can only coach the team they are on.
// Default: true
matchzy_coach_enabled true

// Loaded matches: only SteamIDs in a team's "coaches" list may coach it; a team without a list has no coach.
// Default: false
matchzy_coach_listed_only false

// Where a coach watches from. 1 = the spawns/coach/<map>.json spot if there is one (set with
// .savecoachspawn), else a computed spot behind the team. 2 = always the computed spot.
// Default: 1
matchzy_coaching_mode 1

// ============================================================================
// Practice
// ============================================================================

// Save lineups for everyone instead of per player by default.
// Default: false
matchzy_save_nades_as_global_enabled false

// Grenade history kept per map and per player for .last / .back. 0 = off.
// Default: 512
matchzy_max_saved_last_grenades 512

// Whether players can pick their own smoke color.
// Default: false
matchzy_smoke_color_enabled false

// Keep the whole magazine on reload in practice (no ammo thrown away with the old magazine).
// Default: true
matchzy_prac_disable_magazine_drop true

// .shownades: draw a text label above each lineup beam. false = beams only.
// Default: true
matchzy_grenadelibrary_labels true

// .shownades: size of the text labels. Bigger is easier to read from a distance.
// Default: 0.2
matchzy_grenadelibrary_label_scale 0.2

// .botjiggle: how far (in units) bots strafe from side to side.
// Default: 30
matchzy_botjiggle_range 30

// ============================================================================
// Events and stats
// ============================================================================

// Format of the live events sent to matchzy_remote_log_url (player_death, bomb_planted, player_hurt, ...).
// get5 = Get5's event schema (nested player/weapon objects, round_time). legacy = the flat format of 0.8.94 and older.
// Set the URL itself from a private cfg, not here.
// Default: get5
matchzy_events_format get5

// Whether bots on CT/T get player stats (database, CSV and stats events).
// Each bot is recorded under a stable id (90000000000000000 plus a hash of its name).
// Default: false
matchzy_stats_include_bots false

// ============================================================================
// Admins and other plugins
// ============================================================================

// Give every player admin rights. Only for private testing.
// Default: false
matchzy_everyone_is_admin false

// Whether MatchZy registers the css_map console command (!map). The .map chat command always works.
// It is never registered while a map plugin (CS2-SimpleAdmin, CS2MapChange) is installed, to avoid a
// command conflict that can stop players from connecting. false = never register it.
// Default: true
matchzy_map_console_command_enabled true

// Whether MatchZy handles the css_asay console command (!asay). The .asay chat command always works.
// Set false if another plugin such as CS2-SimpleAdmin owns css_asay, to avoid double messages.
// Default: true
matchzy_asay_console_enabled true

// Only matters if CounterStrikeSharp's configs/core.json has a dot as a chat trigger
// ("PublicChatTrigger": [ "!", "." ]). CounterStrikeSharp then already runs the console command for a dot
// message (.map runs css_map) before MatchZy sees it, so MatchZy skips its own handling of those commands;
// otherwise they would run twice. Commands without a console command (.rdy, .knife, ...) are not affected.
// Default: true
matchzy_dot_trigger_dedupe true
