name: Build and Release
# Releases only from a version tag (0.8.96), never from a plain push to main: a push used to
# publish ModuleVersion as a release straight away, before it was tested on a server.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

# Needed by softprops/action-gh-release to create the GitHub release.
permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      # Auth for the "forgejo" NuGet source in nuget.config (CS2MenuManager and the fork's
      # CounterStrikeSharp.API are published there). Repo secrets FORGEJO_USER + RELEASE_TOKEN;
      # GITHUB_TOKEN cannot authenticate to git.miksen.me.
      NuGetPackageSourceCredentials_forgejo: "Username=${{ secrets.FORGEJO_USER || 'mikkel' }};Password=${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y p7zip-full jq curl wget

      - name: Get MatchZy Version
        id: matchzy_version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' Core/MatchZy.cs)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from Core/MatchZy.cs"
            exit 1
          fi
          # A tag must match the version in the code, or the release and its zip would be mislabelled.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$VERSION" ]; then
            echo "Error: tag ${{ github.ref_name }} does not match ModuleVersion $VERSION in Core/MatchZy.cs"
            exit 1
          fi
          echo "MATCHZY_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: Build MatchZy package
        run: |
          set -e
          # Plugin only. The CounterStrikeSharp runtime bundles (with-cssharp-linux/windows zips)
          # are no longer shipped - install CounterStrikeSharp separately on the server.
          dotnet publish -c Release -o package/addons/counterstrikesharp/plugins/MatchZy
          # Nothing is shipped under cfg/: extracting an update over an existing install must never
          # overwrite an admin's files (config.cfg, mode cfgs, admins.json, database.json, ...), and a
          # cfg/MatchZy/ folder in the zip also created a second folder on servers that use
          # cfg/matchzy/. The plugin writes every missing cfg on load from the copies embedded in the
          # DLL (the repo's cfg/ folder), and writes reference copies of the current defaults (plus
          # database.json.example and a README) to csgo/cfg/<matchzy>/defaults/ on every load, in
          # whichever folder casing the server uses. Nothing for that goes in the zip.
          # Ship MatchZy's gamedata so CounterStrikeSharp auto-loads it (it merges every *.json in
          # the gamedata dir). Provides the signatures MatchZy resolves by key - practice grenade
          # rethrow (.rt/.last/.back) and .breakrestore - so it works on stock CSS without editing
          # the core gamedata.json.
          mkdir -p package/addons/counterstrikesharp/gamedata
          cp gamedata/matchzy.json package/addons/counterstrikesharp/gamedata/matchzy.json
          cd package && 7z a -tzip ../MatchZy-${{ env.MATCHZY_VERSION }}.zip . && cd ..

      - name: Write release notes
        run: |
          # Short body on purpose: the full changelog block made every release long in the release
          # list, pushing the zip far down. CHANGELOG.md stays the only place the changes are
          # written; the body links to it at this tag.
          VER="${{ env.MATCHZY_VERSION }}"
          CHANGELOG_URL="${{ github.server_url }}/${{ github.repository }}/blob/$VER/CHANGELOG.md"
          {
            echo "Download \`MatchZy-$VER.zip\` below and extract it into \`game/csgo/\`. Updating never touches your \`cfg/\` files."
            echo
            echo "What's new: https://matchzy.miksen.me/whats-new/ · Full changelog: [CHANGELOG.md]($CHANGELOG_URL)"
          } > notes.md

      # Creates the release, or refreshes the zip when the release already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ env.MATCHZY_VERSION }}"
          ASSET="MatchZy-${VER}.zip"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" "$ASSET" --clobber
          else
            gh release create "$VER" "$ASSET" --title "MatchZy $VER" --notes-file notes.md
          fi
