name: Build and Release
# Manual only. Releases of mrc4tt/MatchZy are built, tagged and published by the build server
# (cs2-build-system build-all.sh), so a tag push must not start a second release here.
# Kept for forks and as a fallback: Actions -> Build and Release -> Run workflow releases the
# ModuleVersion in Core/MatchZy.cs.
on:
  workflow_dispatch:

# Needed by softprops/action-gh-release to create the GitHub release.
permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y p7zip-full jq curl wget

      - name: Get MatchZy Version
        id: matchzy_version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' Core/MatchZy.cs)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from Core/MatchZy.cs"
            exit 1
          fi
          # A tag must match the version in the code, or the release and its zip would be mislabelled.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$VERSION" ]; then
            echo "Error: tag ${{ github.ref_name }} does not match ModuleVersion $VERSION in Core/MatchZy.cs"
            exit 1
          fi
          echo "MATCHZY_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: Unit tests
        run: dotnet test tests/MatchZy.Tests -c Release

      - name: Build MatchZy package
        run: |
          set -e
          # Plugin only. The CounterStrikeSharp runtime bundles (with-cssharp-linux/windows zips)
          # are no longer shipped - install CounterStrikeSharp separately on the server.
          # MatchZyZip=false: skip the local-zip target in MatchZy.csproj (also skipped via CI=true);
          # this step builds the release zip itself below.
          dotnet publish -c Release -o package/addons/counterstrikesharp/plugins/MatchZy -p:MatchZyZip=false
          # Nothing is shipped under cfg/: extracting an update over an existing install must never
          # overwrite an admin's files (config.cfg, mode cfgs, admins.json, database.json, ...), and a
          # cfg/MatchZy/ folder in the zip also created a second folder on servers that use
          # cfg/matchzy/. The plugin writes every missing cfg on load from the copies embedded in the
          # DLL (the repo's cfg/ folder), and writes reference copies of the current defaults (plus
          # database.json.example and a README) to csgo/cfg/<matchzy>/defaults/ on every load, in
          # whichever folder casing the server uses. Nothing for that goes in the zip.
          # Ship MatchZy's gamedata so CounterStrikeSharp auto-loads it (it merges every *.json in
          # the gamedata dir). Provides the signatures MatchZy resolves by key - practice grenade
          # rethrow (.rt/.last/.back) and .breakrestore - so it works on stock CSS without editing
          # the core gamedata.json.
          mkdir -p package/addons/counterstrikesharp/gamedata
          cp gamedata/matchzy.json package/addons/counterstrikesharp/gamedata/matchzy.json
          cd package && 7z a -tzip ../MatchZy-${{ env.MATCHZY_VERSION }}.zip . && cd ..

      - name: Write release notes
        run: |
          # Short body on purpose: a release lists only the highlights, so the zip stays near the top of
          # the release list. Everything is on the What's new page and in CHANGELOG.md at this tag.
          # From this version's whats-new.md section: the "Action needed" box in full (as a GitHub
          # alert), then at most 5 highlights (the New items, else the Changed ones) and a count of
          # the rest. Docs links in the bullets point to the docs site (relative .md links break on
          # GitHub). Empty when the section is missing; the release then only gets the links.
          VER="${{ env.MATCHZY_VERSION }}"
          CHANGELOG_URL="${{ github.server_url }}/${{ github.repository }}/blob/$VER/CHANGELOG.md"
          python3 - "$VER" > whats-new-section.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          site = "https://matchzy.miksen.me/"
          text = open("documentation/docs/whats-new.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(ver) + r" <small>.*?</small>\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not m:
              sys.exit(0)

          def gh(line):
              line = re.sub(r"\+\+([^+\s][^\s]*?)\+\+", lambda k: k.group(1).replace("+", " + ").title(), line)
              def link(k):
                  path, anchor = k.group(1), k.group(2) or ""
                  path = re.sub(r"(^|/)index\.md$", r"\1", path)
                  path = re.sub(r"\.md$", "/", path)
                  return "](" + site + path + anchor + ")"
              return re.sub(r"\]\((?!https?:)([^)#]*?\.md)(#[^)]*)?\)", link, line)

          alert, items = [], []
          in_alert = False
          for line in m.group(1).strip().splitlines():
              if line.startswith('!!! warning "Action needed"'):
                  alert += ["> [!WARNING]", "> **Action needed**"]
                  in_alert = True
              elif in_alert and line.startswith("    "):
                  alert.append("> " + gh(line[4:]))
              elif line.startswith("- **"):
                  in_alert = False
                  label = re.match(r"- \*\*(\w+):\*\*", line)
                  items.append((label.group(1) if label else "", gh(line)))
              else:
                  in_alert = False

          picks = [i for i in items if i[0] == "New"] or [i for i in items if i[0] == "Changed"] or items
          picks = picks[:5]
          rest = [i for i in items if i not in picks]
          out = alert + ([""] if alert else [])
          if picks:
              out.append("**Highlights**")
              out.append("")
              out += [p[1] for p in picks]
          if rest:
              counts = {}
              for label, _ in rest:
                  counts[label.lower() or "other"] = counts.get(label.lower() or "other", 0) + 1
              out.append("")
              out.append("Plus " + str(len(rest)) + " more (" + ", ".join(f"{n} {k}" for k, n in counts.items()) + ").")
          print("\n".join(out))
          PY
          {
            echo "Download \`MatchZy-$VER.zip\` below and extract it into \`game/csgo/\`. Updating never touches your \`cfg/\` files."
            echo
            if [ -s whats-new-section.md ]; then
              cat whats-new-section.md
              echo
            fi
            echo "**What's new:** https://matchzy.miksen.me/whats-new/ · **Full changelog:** [CHANGELOG.md]($CHANGELOG_URL)"
          } > notes.md

      # Creates the release, or refreshes the zip when the release already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ env.MATCHZY_VERSION }}"
          ASSET="MatchZy-${VER}.zip"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" "$ASSET" --clobber
          else
            gh release create "$VER" "$ASSET" --title "MatchZy $VER" --notes-file notes.md
          fi
