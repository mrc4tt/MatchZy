name: Docs
# Published together with a release (version tag), so the site never describes or links an
# unreleased version: the download buttons point at the tag's MatchZy-<version>.zip. For a docs-only
# fix between releases, run it by hand (Actions > Docs > Run workflow) on the latest release tag
# or on main.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Own Python instead of the runner's system one: newer runner images mark the system Python
      # as externally managed, and a plain pip install fails there.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: documentation/requirements.txt

      - name: Install MkDocs
        run: python -m pip install -r documentation/requirements.txt

      # Deploys as a Pages artifact (Settings > Pages > Source: GitHub Actions), no gh-pages branch.
      # docs/CNAME is copied into the site for the custom domain.
      # The download buttons use @@MATCHZY_VERSION@@; fill in the plugin's ModuleVersion so they
      # always point at the current release zip.
      - name: Insert release version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' Core/MatchZy.cs)
          test -n "$VERSION"
          grep -rl '@@MATCHZY_VERSION@@' documentation/docs | xargs -r sed -i "s/@@MATCHZY_VERSION@@/$VERSION/g"

      - name: Build site
        working-directory: documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
