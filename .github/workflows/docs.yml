name: Docs
on:
  push:
    branches:
      - main
    paths:
      - documentation/**
      - CHANGELOG.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy docs
    # GitHub Pages only exists on the github.com mirror. The job-level `if` skips the whole job on
    # the Forgejo runner, so none of its steps are prepared there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MkDocs
        run: python3 -m pip install -r documentation/requirements.txt

      - name: Deploy to gh-pages
        working-directory: documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Builds with --strict so a broken link fails the deploy. docs/CNAME carries the
          # custom domain (matchzy.miksen.me) onto the gh-pages branch.
          mkdocs gh-deploy --force --strict
