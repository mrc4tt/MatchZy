name: Docs
# Published with a release (version tag), and on a push to main that changes the docs while the
# version in the code is already released. A docs-only fix then goes live right away, but the site
# never describes or links an unreleased version: the download buttons point at that version's zip.
on:
  push:
    branches:
      - main
    paths:
      - documentation/**
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # On main: only when ModuleVersion already has its release tag. A version that is still being
  # prepared waits for its tag, which publishes the docs together with the release.
  check:
    name: Version released?
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release tag
        id: check
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' Core/MatchZy.cs)
          if [ "${{ github.ref_type }}" = "tag" ] || git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is not released yet; the docs go live with its release tag."
          fi

  deploy:
    name: Build and deploy docs
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Own Python instead of the runner's system one: newer runner images mark the system Python
      # as externally managed, and a plain pip install fails there.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: documentation/requirements.txt

      - name: Install MkDocs
        run: python -m pip install -r documentation/requirements.txt

      # Deploys as a Pages artifact (Settings > Pages > Source: GitHub Actions), no gh-pages branch.
      # docs/CNAME is copied into the site for the custom domain.
      # The download buttons use @@MATCHZY_VERSION@@; fill in the plugin's ModuleVersion so they
      # always point at the current release zip.
      - name: Insert release version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' Core/MatchZy.cs)
          test -n "$VERSION"
          grep -rl '@@MATCHZY_VERSION@@' documentation/docs | xargs -r sed -i "s/@@MATCHZY_VERSION@@/$VERSION/g"

      - name: Build site
        working-directory: documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
