name: Bug report
description: Something in MatchZy does not work.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: MatchZy version
      description: Output of `css_matchzy_version` in the server console.
      placeholder: "0.8.96"
    validations:
      required: true
  - type: input
    id: css
    attributes:
      label: CounterStrikeSharp version
      description: Output of `css` or `meta list`.
      placeholder: "1.0.398"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log (optional)
      description: The relevant console lines. Remove tokens and passwords.
      render: text
