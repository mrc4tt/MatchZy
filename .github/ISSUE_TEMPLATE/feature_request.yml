name: Feature request or suggestion
description: A new feature, a change to an existing one, or an idea.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is it?
      options:
        - New feature (a new command, setting or function)
        - Improvement to something MatchZy already does
        - Suggestion or idea
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Describe it
      description: What should MatchZy do? A few sentences are enough.
      placeholder: "Example: a command that shows each player's ping during warmup."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it? (optional)
      description: Your server or situation (tournament, pugs, practice, panel, ...).
